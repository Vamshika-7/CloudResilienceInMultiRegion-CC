apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-rb
  namespace: region-b
  labels:
    app: frontend-rb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-rb
  template:
    metadata:
      labels:
        app: frontend-rb
    spec:
      containers:
        - name: frontend
          image: cc-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-rb
  namespace: region-b
  labels:
    app: frontend-rb
spec:
  type: ClusterIP
  selector:
    app: frontend-rb
  ports:
    - port: 80
      targetPort: 80
      name: http