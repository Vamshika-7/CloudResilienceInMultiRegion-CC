apiVersion: apps/v1
kind: Deployment
metadata:
  name: haproxy-active-active
  namespace: ecommerce
  labels:
    app: haproxy-active-active
spec:
  replicas: 1
  selector:
    matchLabels:
      app: haproxy-active-active
  template:
    metadata:
      labels:
        app: haproxy-active-active
    spec:
      containers:
        - name: haproxy
          image: haproxy:2.6
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: config
              mountPath: /usr/local/etc/haproxy/haproxy.cfg
          volumes:
            - name: config
              configMap:
                name: haproxy-config
                items:
                  - key: haproxy.cfg
                    path: haproxy.cfg