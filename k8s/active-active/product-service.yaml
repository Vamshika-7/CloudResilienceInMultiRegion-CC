apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service-rb
  namespace: region-b
  labels:
    app: product-service-rb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service-rb
  template:
    metadata:
      labels:
        app: product-service-rb
    spec:
      containers:
        - name: product-service
          image: cc-product-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
              name: http
          env:
            - name: SERVICE_NAME
              value: "product-service-rb"
            - name: PRODUCT_SERVICE_PORT
              valueFrom:
                configMapKeyRef:
                  name: region-b-config
                  key: PRODUCT_SERVICE_PORT
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: region-b-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: region-b-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: region-b-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: region-b-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: region-b-secrets
                  key: DB_PASSWORD
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: region-b-secrets
                  key: DATABASE_URL
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: product-service-rb
  namespace: region-b
  labels:
    app: product-service-rb
spec:
  type: ClusterIP
  selector:
    app: product-service-rb
  ports:
    - port: 8001
      targetPort: 8001
      name: http