apiVersion: v1
kind: Secret
metadata:
  name: region-b-secrets
  namespace: region-b
type: Opaque
stringData:
  DB_USER: "postgres"
  DB_PASSWORD: "postgres"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"
  DATABASE_URL: "postgresql://postgres:postgres@k3d-ecommerce-server-0:30432/ecommerce"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: region-b-config
  namespace: region-b
data:
  REGION_ID: "region-b"
  DB_HOST: "k3d-ecommerce-server-0"
  DB_PORT: "30432"
  DB_NAME: "ecommerce"
  POSTGRES_DB: "ecommerce"
  PRODUCT_SERVICE_PORT: "8001"
  ORDER_SERVICE_PORT: "8002"
  PAYMENT_SERVICE_PORT: "8003"
  GATEWAY_PORT: "8000"
  PRODUCT_SERVICE_URL: "http://product-service-rb:8001"
  ORDER_SERVICE_URL: "http://order-service-rb:8002"
  PAYMENT_SERVICE_URL: "http://payment-service-rb:8003"