apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: test-network-bandwidth
  namespace: chaos-lab
spec:
  action: bandwidth
  mode: all
  selector:
    namespaces:
      - chaos-lab
    labelSelectors:
      run: network-test
  bandwidth:
    rate: "1mbps"
    limit: 20971520
    buffer: 10000
  duration: "30s"
